<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Control Mode</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .mode-container {
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 2rem;
        }

        .mode-button {
            display: inline-block;
            padding: 1.5rem 3rem;
            margin: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            color: white;
        }

        .manual-btn {
            background-color: #4CAF50; /* Green */
        }

        .auto-btn {
            background-color: #2196F3; /* Blue */
        }

        .mode-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .footer {
            position: fixed;
            bottom: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="mode-container">
        <h1>Select Control Mode</h1>
        <a href="/manual" class="mode-button manual-btn">Manual Control</a>
        <a href="/auto" class="mode-button auto-btn">Automated Mode</a>
    </div>
    <div class="footer">
        Human Following Robot Control System
    </div>
</body>
</html>
